publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^10.0.0
  huawei_health: 6.17.0+300
  path_provider: ^2.1.5
  cryptography: ^2.7.0
