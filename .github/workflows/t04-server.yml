name: T04 server
on:
  push:
    paths: ['server/**', 'docker-compose.yml', 'docs/api/*.yaml', '.github/workflows/t04-server.yml']
  pull_request:
    paths: ['server/**', 'docker-compose.yml', 'docs/api/*.yaml', '.github/workflows/t04-server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Verify generated code and unit tests
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.1
          ./server/generate.sh
          git diff --exit-code -- server/internal/api
          cd server
          go vet ./...
          go test -race ./...
      - name: Run real service, migrations and privacy protocol
        run: ./server/tests/runtime.sh
