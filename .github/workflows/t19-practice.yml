name: T19 practice HTTP and SSE
on:
  push:
    paths: ['server/**', 'docker-compose.yml', 'docs/api/*.yaml', '.github/workflows/t19-practice.yml']
  pull_request:
    paths: ['server/**', 'docker-compose.yml', 'docs/api/*.yaml', '.github/workflows/t19-practice.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  practice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {persist-credentials: false}
      - name: Verify isolated practice API and settlement
        run: ./server/tests/t19-wire.sh
