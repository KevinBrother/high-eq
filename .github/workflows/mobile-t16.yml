name: Mobile scaffold
on:
  push:
    paths: ['app/**', 'docs/api/app.yaml', '.github/workflows/mobile-t16.yml']
  pull_request:
    paths: ['app/**', 'docs/api/app.yaml', '.github/workflows/mobile-t16.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.38.10', cache: true}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - name: Check generated surface, analyze and test
        working-directory: app
        run: |
          python3 -m venv "$RUNNER_TEMP/mobile-codegen"
          "$RUNNER_TEMP/mobile-codegen/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/mobile-codegen/bin/python" tool/generate_api.py --check
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd app && flutter test -d emulator-5554 integration_test/smoke_test.dart
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.38.10', cache: true}
      - name: Test on iPhone Simulator
        working-directory: app
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json;print(next(d["udid"] for d in json.load(sys.stdin)["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-26-5"] if d["name"] == "iPhone 17 Pro"))')
          xcrun simctl bootstatus "$UDID" -b
          flutter pub get --enforce-lockfile
          tool/ios_smoke.sh "$UDID"
