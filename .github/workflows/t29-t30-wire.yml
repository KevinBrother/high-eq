name: T29/T30 voice wire

on:
  push:
    paths:
      - 'app/**'
      - 'server/**'
      - 'docs/api/*.yaml'
      - 'docker-compose.yml'
      - '.github/workflows/t29-t30-wire.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'server/**'
      - 'docs/api/*.yaml'
      - 'docker-compose.yml'
      - '.github/workflows/t29-t30-wire.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.38.10', cache: true}
      - name: Install app dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Check T29 formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib/features/voice test/voice tool/t29
      - name: Analyze voice module and live test
        working-directory: app
        run: dart analyze lib/features/voice tool/t29
      - name: Verify T29 clients bypass proxy settings
        working-directory: app
        run: ./tool/t29/with_sentinel_proxy.sh flutter --no-version-check --suppress-analytics test --no-pub -r expanded tool/t29/proxy_isolation_test.dart
      - name: Exercise T29 client against disposable T30 HTTP/PG/Redis
        run: bash app/tool/t29/live.sh
