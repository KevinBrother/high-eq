name: Migration history
on:
  pull_request:
    branches: [main]
    paths: ['server/migrations/**', 'scripts/migration_history/**', '.github/workflows/migration-history.yml']
  push:
    branches: [main]
    paths: ['server/migrations/**', 'scripts/migration_history/**', '.github/workflows/migration-history.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify published versions and paired SQL files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m unittest discover -s scripts/migration_history
          python3 scripts/migration_history/check.py "$BASE" HEAD
