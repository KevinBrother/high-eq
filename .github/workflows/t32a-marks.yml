name: T32A free manual marks
on:
  workflow_dispatch:
  push:
    paths: ['app/**', 'server/**', 'docs/api/app.yaml', '.github/workflows/t32a-marks.yml']
  pull_request:
    paths: ['app/**', 'server/**', 'docs/api/app.yaml', '.github/workflows/t32a-marks.yml']
permissions:
  contents: read
jobs:
  marks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.38.10', cache: true}
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: server/tests/t32a-verify.sh

  journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.38.10', cache: true}
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Prepare Go modules for offline journey
        working-directory: server
        run: go mod download
      - name: Install disposable PostgreSQL 17 and Redis 8.2
        run: |
          sudo apt-get update
          if ! apt-cache show postgresql-17 >/dev/null 2>&1; then
            sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
            sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' \
              | sudo tee /etc/apt/sources.list.d/t32a-pgdg.list >/dev/null
            sudo apt-get update
          fi
          sudo apt-get install -y --no-install-recommends postgresql-17 build-essential redis-tools
          bash app/tool/t27/install_redis.sh "$RUNNER_TEMP/t32a-redis"
      - name: Free mark, draft-backed review and one net debit
        env:
          T32A_DISPOSABLE: yes
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$RUNNER_TEMP/t32a-redis:$PATH"
          bash app/tool/t32a/verify.sh
