name: T28 health history
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'server/**'
      - 'docker-compose.yml'
      - '.github/workflows/t28-health.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'server/**'
      - 'docker-compose.yml'
      - '.github/workflows/t28-health.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Public CI exercises the default platform channel. A restricted Huawei
    # build requires issuer-owned app ID and AG Connect project material, which
    # must not be fabricated in source control. Its fail-closed configuration
    # contract is covered by test/health/huawei_release_config_test.dart.
    env:
      ORG_GRADLE_PROJECT_t28Distribution: platform
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {persist-credentials: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.38.10', cache: true}
      - working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub test/health
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: cd app && flutter test --no-pub -d emulator-5554 --dart-define=EXPECT_RESTRICTED=false integration_test/t28_health_platform_test.dart
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.38.10', cache: true}
      - working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          tool/t28/compile_healthkit.sh
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"] == "iPhone 17 Pro"))')
          xcrun simctl bootstatus "$udid" -b
          tool/ios_smoke.sh "$udid"
  live-t30:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.38.10', cache: true}
      - working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          tool/t28/live.sh
