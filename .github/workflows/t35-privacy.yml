name: T35 privacy and account closure

on:
  push:
    paths:
      - '.github/workflows/t35-privacy.yml'
      - 'app/assets/**'
      - 'app/lib/**'
      - 'app/pubspec.yaml'
      - 'app/pubspec.lock'
      - 'app/test/**'
      - 'app/tool/t35-privacy/**'
      - 'app/tool/t35/**'
      - 'app/tool/t26/transport.dart'
      - 'app/tool/t27/**'
      - 'app/tool/t29/loopback_client.dart'
      - 'docker-compose.yml'
      - 'docs/api/app.yaml'
      - 'server/**'
  pull_request:
    paths:
      - '.github/workflows/t35-privacy.yml'
      - 'app/assets/**'
      - 'app/lib/**'
      - 'app/pubspec.yaml'
      - 'app/pubspec.lock'
      - 'app/test/**'
      - 'app/tool/t35-privacy/**'
      - 'app/tool/t35/**'
      - 'app/tool/t26/transport.dart'
      - 'app/tool/t27/**'
      - 'app/tool/t29/loopback_client.dart'
      - 'docker-compose.yml'
      - 'docs/api/app.yaml'
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Formal privacy client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {persist-credentials: false}
      - name: Check receipts and service orchestration offline
        run: python3 -B -m unittest discover -s app/tool/t35-privacy -p 'test_*.py'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.38.10', cache: true}
      - name: Prepare locked Flutter dependencies and Linux artifacts
        working-directory: app
        run: |
          flutter precache --linux
          flutter pub get --enforce-lockfile
      - name: Require six privacy journey receipts and client regressions
        run: bash app/tool/t35-privacy/gate.sh client

  formal-export:
    name: Formal account export over real HTTP
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.38.10', cache: true}
      - name: Prepare locked Flutter dependencies and Linux artifacts
        working-directory: app
        run: |
          flutter precache --linux
          flutter pub get --enforce-lockfile
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Prepare Go modules for offline journey
        working-directory: server
        run: go mod download
      - name: Reject swapped assessment rows in offline export receipts
        run: bash app/tool/t35-privacy/gate.sh export-ownership
      - name: Install native PostgreSQL 17 and Redis binaries
        run: |
          sudo apt-get update
          if ! apt-cache show postgresql-17 >/dev/null 2>&1; then
            sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
            sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' \
              | sudo tee /etc/apt/sources.list.d/t35-pgdg.list >/dev/null
            sudo apt-get update
          fi
          sudo apt-get install -y --no-install-recommends postgresql-17 build-essential
          bash app/tool/t27/install_redis.sh "$RUNNER_TEMP/t35-redis"
      - name: Require real account export and synthetic receiver receipts
        run: |
          python3 -B app/tool/t35-privacy/export_journey.py \
            --pg-bin /usr/lib/postgresql/17/bin --redis "$RUNNER_TEMP/t35-redis/redis-server"
      - name: Require selected-record deletion and A/B exports over real HTTP
        run: |
          python3 -B app/tool/t35-privacy/record_delete_journey.py \
            --pg-bin /usr/lib/postgresql/17/bin --redis "$RUNNER_TEMP/t35-redis/redis-server"

  service:
    name: Privacy service and account lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Require contract, storage lifecycle and export receipts
        run: bash app/tool/t35-privacy/ci-service.sh
