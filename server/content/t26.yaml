source_note: "原创虚构材料，不对应真实人物或事件；未经外部人工审核。"
exercises:
  - id: "26000000-0000-4000-8000-000000000001"
    scene: work
    focus: observation
    question: "同事把文件放下后说：“你看着改吧。”你最先能确认的事实是什么？"
    choices: ["对方完全不信任你的能力", "对方把文件放下并说让你看着改", "对方一定在生气"]
    answer_index: 1
    explanation: "只描述看得见、听得到的行为和原话，不替对方补写动机。"
