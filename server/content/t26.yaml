    focus: observation
    question: "邻居说“我会注意”，但音乐仍然很响。你应先确认什么？"
    choices: ["邻居在耍我", "邻居根本没有羞耻心", "邻居说了会注意，音乐仍然很响"]
    answer_index: 2
