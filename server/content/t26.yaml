cards:
  - id: "26000000-0000-4000-8000-000000000101"
    scene: work
    title: "工作场景：先分开事实与评价"
    body: "把“对方不配合”改写成可观察到的动作、时间和原话，再询问对方的目的。事实越清楚，越容易找到可讨论的下一步。"
  - id: "26000000-0000-4000-8000-000000000102"
    scene: work
    title: "工作场景：提出可执行请求"
    body: "请求尽量包含时间、动作和确认方式，例如“周三中午前发我版本，并标出两个风险点，可以吗？”"
  - id: "26000000-0000-4000-8000-000000000103"
    scene: work
    title: "工作场景：被打断时"
    body: "先保护对话秩序：“我想把这句话说完，大约还需要一分钟。”不必先证明对方有恶意。"
  - id: "26000000-0000-4000-8000-000000000104"
    scene: work
    title: "工作场景：反馈而非指责"
    body: "用“我观察到……我有些担心……我希望……”组织反馈，把评价留在事实之后。"
  - id: "26000000-0000-4000-8000-000000000105"
    scene: partner
    title: "伴侣场景：情绪高涨时先降速"
    body: "声音变大或开始翻旧账时，可以先暂停二十分钟，约定具体回来时间，再讨论一件具体的事。"
  - id: "26000000-0000-4000-8000-000000000106"
    scene: partner
    title: "伴侣场景：表达需要"
    body: "需要不是命令。把“你必须陪我”换成“我希望今晚有一段不被打断的相处时间”。"
  - id: "26000000-0000-4000-8000-000000000107"
    scene: partner
    title: "伴侣场景：道歉的四件事"
    body: "承认影响、说出自己的责任、表达歉意、提出下次可做的具体改变；避免用“但是”抵消道歉。"
  - id: "26000000-0000-4000-8000-000000000108"
    scene: partner
    title: "伴侣场景：请求连接"
    body: "邀请比质问更容易被接住：“我现在有点低落，想抱一会儿，你方便吗？”"
  - id: "26000000-0000-4000-8000-000000000109"
    scene: family
    title: "家庭场景：边界与关心并存"
    body: "可以同时承认关心和坚持边界：“我知道你担心我，但这个安排我想自己决定。”"
  - id: "26000000-0000-4000-8000-000000000110"
    scene: family
    title: "家庭场景：减少比较"
    body: "把话题拉回具体需要：“我想先说完近况，暂时不讨论谁更成功。”"
  - id: "26000000-0000-4000-8000-000000000111"
    scene: family
    title: "家庭场景：拒绝临时安排"
    body: "拒绝时给出简短理由和替代时间，不必用长篇辩解换取许可。"
  - id: "26000000-0000-4000-8000-000000000112"
    scene: family
    title: "家庭场景：代际差异"
    body: "先确认对方担心什么，再说明自己的选择；理解不等于同意，边界也不需要争吵。"
  - id: "26000000-0000-4000-8000-000000000113"
    scene: friends
    title: "朋友场景：临时改约"
    body: "先确认新信息，再表达影响：“临时改时间让我有点难安排，下次能早点说吗？”"
  - id: "26000000-0000-4000-8000-000000000114"
    scene: friends
    title: "朋友场景：玩笑越界"
    body: "可以直接说明边界：“这个玩笑我不太舒服，我们换个话题。”不必笑着忍过去。"
  - id: "26000000-0000-4000-8000-000000000115"
    scene: friends
    title: "朋友场景：拒绝请求"
    body: "拒绝具体请求，不拒绝整个人：“今天我不能帮你搬，但可以帮你联系其他人。”"
  - id: "26000000-0000-4000-8000-000000000116"
    scene: friends
    title: "朋友场景：联系变少"
    body: "用邀请代替猜测：“最近有点想你，周末要不要一起走走？”"
  - id: "26000000-0000-4000-8000-000000000117"
    scene: social
    title: "公共场景：安全优先"
    body: "面对陌生人时先评估距离和出口，再决定是否沟通；保护安全比赢下争论重要。"
  - id: "26000000-0000-4000-8000-000000000118"
    scene: social
    title: "公共场景：简短边界"
    body: "一句边界通常足够：“请不要再靠近”“这个我不回答”“请排队”。重复边界，不急着解释。"
  - id: "26000000-0000-4000-8000-000000000119"
    scene: social
    title: "公共场景：澄清规定"
    body: "遇到“这是规定”时，问具体条款、适用条件和可替代方案，避免把不满升级为冲突。"
  - id: "26000000-0000-4000-8000-000000000120"
    scene: social
    title: "公共场景：发出请求"
    body: "请求要短、具体、可执行，并给对方一个容易回应的选项。"
