    Safety:
      type: object
      additionalProperties: false
      required:
      - safety
      - message
      properties:
        safety:
          type: boolean
          enum:
          - true
          description: 仅接受 true。
        message: {type: string, enum: [听起来你现在可能正经历很难受的事。这里不适合继续练习，建议你马上联系专业的人：全国心理援助热线 12356；如果有人身危险，请立即拨打 110 或 120。]}
    Tokens:
      type: object
      additionalProperties: false
      required:
      - access_token
      - refresh_token
      - expires_at
      - user_id
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        expires_at: {type: string, format: date-time}
        user_id: {type: string, format: uuid}
    Consent:
      type: object
      additionalProperties: false
      required:
