components:
  securitySchemes:
    Bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      properties:
        code: {type: string}
