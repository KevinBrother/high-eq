          - terms
          - privacy
          - assessment
          - health
          - voice
          - audio_retention
          - practice
          - review
          - contacts
          - chat_import
          - manual_mark
        version: {type: string}
        granted: {type: boolean}
        updated_at: {type: string, format: date-time}
    Account:
      type: object
      additionalProperties: false
      required:
      - user_id
      - timezone
      - bindings
      - frozen_until
      properties:
        user_id: {type: string, format: uuid}
        timezone: {type: string}
        bindings:
          type: array
          items: {type: string, enum: [phone, apple, wechat]}
          minItems: 0
        frozen_until: {type: string, format: date-time, nullable: true}
    Credential:
      type: object
      additionalProperties: false
      required:
      - provider
      - proof
      properties:
        provider: {type: string, enum: [phone, apple, wechat]}
        proof: {type: string}
        phone: {type: string}
    RequestCodeInput:
      type: object
      additionalProperties: false
      required:
      - phone
      properties:
        phone: {type: string}
    LoginInput:
      type: object
      additionalProperties: false
      required:
      - credential
      properties:
