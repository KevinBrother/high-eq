        contact_id: {type: string, format: uuid}
        mark_id: {type: string, format: uuid}
        scene: {type: string, enum: [work, partner, family, friends, social]}
        occurred_at: {type: string, format: date-time}
        signal_event_id: {type: string, format: uuid}
    Review:
      type: object
      additionalProperties: false
      required:
      - id
      - submitted
      - score
      - repair_phrase
      properties:
        id: {type: string, format: uuid}
        submitted: {$ref: '#/components/schemas/ReviewInput'}
        score: {$ref: '#/components/schemas/FullScore'}
        repair_phrase: {type: string, minLength: 1}
    ListReviewsResult:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Review'}
          minItems: 0
        next_cursor: {type: string, nullable: true}
    PlanItem:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - title
      - content_id
      - completed
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [exercise, level, card]}
        title: {type: string, minLength: 1}
        content_id: {type: string, format: uuid}
        completed: {type: boolean}
    GetTodayPlanResult:
      type: object
      additionalProperties: false
      required:
      - day
      - personalized
      - items
      properties:
        day: {type: string, format: date}
        personalized: {type: boolean}
        items:
          type: array
          items: {$ref: '#/components/schemas/PlanItem'}
          minItems: 0
    CompletePlanItemResult:
      type: object
      additionalProperties: false
      required:
      - streak
      - achievements
      properties:
        streak: {type: integer, minimum: 0}
        achievements:
          type: array
          items: {type: integer}
          minItems: 0
    GetExerciseResult:
      type: object
      additionalProperties: false
      required:
      - id
      - question
      - choices
      properties:
        id: {type: string, format: uuid}
        question: {type: string, minLength: 1}
        choices:
          type: array
          items: {type: string, minLength: 1}
          minItems: 2
    AnswerExerciseInput:
      type: object
      additionalProperties: false
      required:
      - choice_index
      properties:
        choice_index: {type: integer, minimum: 0}
    AnswerExerciseResult:
      type: object
      additionalProperties: false
      required:
      - correct
      - explanation
      properties:
        correct: {type: boolean}
        explanation: {type: string, minLength: 1}
    GetCardResult:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - body
      - scene
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1}
        body: {type: string, minLength: 1}
        scene: {type: string, enum: [work, partner, family, friends, social]}
    GetGrowthResult:
      type: object
      additionalProperties: false
      required:
      - latest_assessment
      - wleis_percent
      - training_reference
      - valid_behavior_count
      - streak
      - achievements
      properties:
        latest_assessment: {type: string, format: uuid, nullable: true}
        wleis_percent: {type: number, minimum: 0, maximum: 100, nullable: true}
        training_reference: {type: number, minimum: 0, maximum: 100, nullable: true}
        valid_behavior_count: {type: integer, minimum: 0}
        streak: {type: integer, minimum: 0}
        achievements:
          type: array
          items: {type: integer}
          minItems: 0
    WindowStat:
      type: object
      additionalProperties: false
      required:
      - mean
      - maximum
      - sample_count
      - valid_seconds
      properties:
        mean: {type: number}
        maximum: {type: number}
        sample_count: {type: integer, minimum: 1}
        valid_seconds: {type: integer, minimum: 0, maximum: 30}
    HrvStat:
      type: object
      additionalProperties: false
      required:
      - mean
      - maximum
      - sample_count
      properties:
        mean: {type: number}
        maximum: {type: number}
        sample_count: {type: integer, minimum: 1}
      description: 在同一 30 秒窗内聚合的离散 HRV 读数；不换算成有效秒数。
    HealthWindow:
      type: object
      additionalProperties: false
      required:
      - channel
      - starts_at
      - duration_seconds
      - exercise
      - source
      properties:
        channel: {type: string, enum: [health]}
        starts_at: {type: string, format: date-time}
        duration_seconds: {type: integer, enum: [30]}
        exercise: {type: boolean}
        source: {type: string, enum: [watch_live, apple_history, health_connect, huawei_history]}
        heart_rate: {$ref: '#/components/schemas/WindowStat'}
        hrv: {$ref: '#/components/schemas/HrvStat'}
        cadence: {$ref: '#/components/schemas/WindowStat'}
      minProperties: 6
    VoiceWindow:
      type: object
      additionalProperties: false
      required:
      - channel
      - starts_at
      - duration_seconds
      - exercise
      - voiced_seconds
      properties:
        channel: {type: string, enum: [voice]}
        starts_at: {type: string, format: date-time}
        duration_seconds: {type: integer, enum: [30]}
        exercise: {type: boolean}
        voiced_seconds: {type: integer, minimum: 0, maximum: 30}
        speech_rate: {$ref: '#/components/schemas/WindowStat'}
        volume: {$ref: '#/components/schemas/WindowStat'}
        pitch: {$ref: '#/components/schemas/WindowStat'}
      description: 零人声可不带任何特征；不能拿静音累计基线。
    WindowUpload:
      oneOf:
      - {$ref: '#/components/schemas/HealthWindow'}
      - {$ref: '#/components/schemas/VoiceWindow'}
    DurationProgress:
      type: object
      additionalProperties: false
      required:
      - valid_days
      - today_valid_seconds
      - ready
      - reason
      - baseline
      - threshold
      properties:
        valid_days: {type: integer, minimum: 0}
        today_valid_seconds: {type: integer, minimum: 0}
        ready: {type: boolean}
        reason:
          type: string
          description: 说明趋势可用性或缺失原因，不是冷启动倒计时。
        baseline: {type: number, nullable: true}
        threshold: {type: number, nullable: true}
      description: valid_days 为累计有效日；today_valid_seconds 是账号时区今日的有效秒数，未就绪须给出原因。
    SignalEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - starts_at
      - kind
      - confirmation
      properties:
        id: {type: string, format: uuid}
        starts_at: {type: string, format: date-time}
        kind: {type: string, enum: [self_fluctuation, conversation_rhythm]}
        contact_id: {type: string, format: uuid, nullable: true}
        scene: {type: string, nullable: true, pattern: ^(work|partner|family|friends|social)$}
        confirmation: {type: string, enum: [pending, 'yes', 'no']}
  responses:
    E400:
      description: 请检查输入
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: invalid_argument
            message: 请检查输入
            retryable: false
    E401:
      description: 请重新登录
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: unauthenticated
            message: 请重新登录
            retryable: false
    E403:
      description: 此操作需要对应权限
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: forbidden
            message: 此操作需要对应权限
            retryable: false
    E404:
      description: 未找到记录
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: not_found
            message: 未找到记录
            retryable: false
    E409:
      description: 请核对当前状态
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: conflict
            message: 请核对当前状态
            retryable: false
    E429:
      description: 今日次数已用完
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: quota_exceeded
            message: 今日次数已用完
            retryable: false
    E503:
      description: 服务暂不可用，可重试
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: moderation_unavailable
            message: 服务暂不可用，可重试
            retryable: true
    E500:
      description: 请稍后再试
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: internal_error
            message: 请稍后再试
            retryable: true
