        privacy_version: {type: string}
        terms_version: {type: string}
    RefreshTokensInput:
      type: object
      additionalProperties: false
      required:
      - refresh_token
      properties:
        refresh_token: {type: string}
    LogoutInput:
      type: object
      additionalProperties: false
      required:
      - refresh_token
      properties:
        refresh_token: {type: string}
    UpdateMeInput:
      type: object
      additionalProperties: false
