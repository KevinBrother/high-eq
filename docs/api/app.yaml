                score: {type: integer, minimum: 0, maximum: 25, enum: [0, 5, 10, 15, 25]}
                reason: {type: string, minLength: 1}
            request:
              type: object
              additionalProperties: false
              required:
              - score
              - reason
              properties:
                score: {type: integer, minimum: 0, maximum: 25, enum: [0, 5, 10, 15, 25]}
