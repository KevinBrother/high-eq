openapi: 3.0.3
info:
  title: 情商训练 · app
  version: 1.0.0
  description: 身份来自访问令牌；所有源 ID 都须验证账号归属。列表游标不透明，按时间及唯一键稳定排序。示例中的令牌、凭据、文本和交易均为虚构。
security:
- Bearer: []
paths:
  /v1/auth/sms:
    post:
      operationId: requestCode
      tags:
      - auth
      summary: 请求验证码（60 秒一次，每日最多 10 次）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequestCodeInput'}
            example:
              phone: '+8613800000000'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ack'}
              example:
                ok: true
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '429':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                code: quota_exceeded
                message: 验证码请求过于频繁，请稍后再试
                retryable: true
      x-example-request: POST /v1/auth/sms
  /v1/auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: 验证登录方式；首次注册要求年龄确认及同意版本
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginInput'}
            example:
              credential:
                provider: phone
                proof: example-only
                phone: '+8613800000000'
              age_confirmed: true
              privacy_version: 2026-11
              terms_version: 2026-11
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tokens'}
              example:
                access_token: example-only
                refresh_token: example-only
                expires_at: '2026-11-21T09:00:00+08:00'
                user_id: 85b72033-9f07-4bbc-8567-fc31f26508ab
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
        '409': {$ref: '#/components/responses/E409'}
      description: 已有账号凭已验证身份登录；首次注册另须 age_confirmed=true 及当前隐私政策/用户协议版本，不满足则拒绝注册。
      x-example-request: POST /v1/auth/login
  /v1/auth/refresh:
    post:
      operationId: refreshTokens
      tags:
      - auth
      summary: 轮换访问与刷新令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshTokensInput'}
            example:
              refresh_token: example-only
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tokens'}
              example:
                access_token: example-only
                refresh_token: example-only
                expires_at: '2026-11-21T09:00:00+08:00'
                user_id: 85b72033-9f07-4bbc-8567-fc31f26508ab
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      x-example-request: POST /v1/auth/refresh
  /v1/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: 撤销当前刷新令牌
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogoutInput'}
            example:
              refresh_token: example-only
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ack'}
              example:
                ok: true
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      x-example-request: POST /v1/auth/logout
  /v1/me:
    get:
      operationId: getMe
      tags:
      - me
      summary: 查阅个人账号
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
              example:
                user_id: 85b72033-9f07-4bbc-8567-fc31f26508ab
                timezone: Asia/Shanghai
                bindings:
                - phone
                frozen_until: null
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      x-example-request: GET /v1/me
    patch:
      operationId: updateMe
      tags:
      - me
      summary: 更正时区
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMeInput'}
            example:
              timezone: Asia/Shanghai
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
              example:
                user_id: 85b72033-9f07-4bbc-8567-fc31f26508ab
                timezone: Asia/Shanghai
                bindings:
                - phone
                frozen_until: null
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      x-example-request: PATCH /v1/me
  /v1/me/bindings:
    post:
      operationId: bindIdentity
      tags:
      - me
      summary: 重新验证后手动绑定，冲突不合并
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BindIdentityInput'}
            example:
              current_proof: {provider: apple, proof: example-current-identity}
              credential:
                provider: phone
                proof: example-only
                phone: '+8613800000000'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
              example:
                user_id: 85b72033-9f07-4bbc-8567-fc31f26508ab
                timezone: Asia/Shanghai
                bindings:
                - phone
                frozen_until: null
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
        '409': {$ref: '#/components/responses/E409'}
      description: 409 时保留当前令牌且不改任何归属。保留当前账号无需请求；要切换须经 /v1/auth/switch 重新验证原账号。
      x-example-request: POST /v1/me/bindings
  /v1/auth/switch:
    post:
      operationId: switchIdentity
      tags:
      - auth
      summary: 冲突后验证原账号并切换，不转移数据或权益
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SwitchIdentityInput'}
            example:
              credential:
                provider: phone
                proof: example-only
                phone: '+8613800000000'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tokens'}
              example:
                access_token: example-only
                refresh_token: example-only
                expires_at: '2026-11-21T09:00:00+08:00'
                user_id: 85b72033-9f07-4bbc-8567-fc31f26508ab
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      description: 仅凭另一账号已重新验证的登录方式换发其令牌，客户端清除并隔离旧账号缓存。不会迁移数据、权益或购买归属。
      x-example-request: POST /v1/auth/switch
  /v1/me/closure:
    post:
      operationId: freezeAccount
      tags:
      - me
      summary: 重新认证后冻结 15 天；先提示取消苹果订阅
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FreezeAccountInput'}
            example:
              proof: {provider: apple, proof: example-current-identity}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FreezeAccountResult'}
              example:
                frozen_until: '2026-11-21T09:00:00+08:00'
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      x-example-request: POST /v1/me/closure
    delete:
      operationId: cancelClosure
      tags:
      - me
      summary: 冷静期内经登录撤销注销
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ack'}
              example:
                ok: true
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      x-example-request: DELETE /v1/me/closure
  /v1/me/consents:
    get:
      operationId: listConsents
      tags:
      - me
      summary: 列出各用途当前的授权决定
      description: 每个用途只返回最新决定（含已撤回）；按决定更新时间和唯一键降序游标分页。完整历史仅在本人导出中返回。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListConsentsResult'}
              example:
                items:
                - purpose: terms
                  version: 2026-11
                  granted: true
                  updated_at: '2026-11-21T09:00:00+08:00'
                next_cursor: null
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      parameters:
      - in: query
        name: cursor
        schema: {type: string}
        example: after-example
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100}
        example: 20
      x-example-request: GET /v1/me/consents?cursor=after-example&limit=20
  /v1/me/consents/{purpose}:
    put:
      operationId: setConsent
      tags:
      - me
      summary: 按用途授权或立即撤回
      parameters:
      - in: path
        name: purpose
        required: true
        schema:
          type: string
          enum:
          - terms
          - privacy
          - assessment
          - health
          - voice
          - audio_retention
          - practice
          - review
          - contacts
          - chat_import
          - manual_mark
        example: terms
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetConsentInput'}
            example:
              version: 2026-11
              granted: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Consent'}
              example:
                purpose: terms
                version: 2026-11
                granted: true
                updated_at: '2026-11-21T09:00:00+08:00'
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      description: 逐用途保存版本与授权/撤回时间；撤回相应采集用途立即拒绝后续窗口。客户端先清未发队列，不得恢复联网后补传。
      x-example-request: PUT /v1/me/consents/terms
  /v1/me/export:
    get:
      operationId: exportData
      tags:
      - me
      summary: 流式生成当前账号 JSON 压缩包，不落盘
      responses:
        '200':
          description: ZIP：manifest.json 及按模块分组的 JSON；不含录音、密钥或其他账号。
          content:
            application/zip:
              schema: {type: string, format: binary}
              x-example-files:
                manifest.json:
                  modules:
                  - manual_marks
                manual_marks.json: []
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      x-example-request: GET /v1/me/export
  /v1/me/data/{kind}/{id}:
    delete:
      operationId: deleteSource
      tags:
      - me
      summary: 删除源及副本，重算成长分
      parameters:
      - in: path
        name: kind
        required: true
        schema:
          type: string
          enum:
          - assessments
          - sessions
          - reviews
          - replies
          - contacts
          - manual_marks
          - signal_events
        example: assessments
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
        example: 85b72033-9f07-4bbc-8567-fc31f26508ab
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ack'}
              example:
                ok: true
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
        '404': {$ref: '#/components/responses/E404'}
      description: id 是该类别的外部资源 ID：会话/复盘/回复为活动 ID，不是评分 ID；服务端验证归属并解析独立清理用的 source_id。窗口按 starts_at + channel 删除。
      x-example-request: DELETE /v1/me/data/assessments/85b72033-9f07-4bbc-8567-fc31f26508ab
  /v1/entitlements:
    get:
      operationId: getEntitlements
      tags:
      - entitlements
      summary: 本人跨平台权益；无限额度返回 null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Entitlements'}
              example:
                tier: free
                expires_at: null
                allowances:
                - feature: practice
                  remaining: 3
                  resets_at: '2026-11-22T00:00:00+08:00'
                - feature: reply
                  remaining: 3
                  resets_at: '2026-11-22T00:00:00+08:00'
                - feature: review
                  remaining: 3
                  resets_at: '2026-11-22T00:00:00+08:00'
                max_active_contacts: 1
                auto_watch_alert_available: false
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      description: 三个 AI 功能独立按账号时区自然日重置，默认免费各 3 次，会员 remaining=null；auto_watch_alert_available 只在对应生产版本获放行后才可开启。 会员到期停止采集，默认最近使用的 1 个关系人仍可用，其余只读；用户可以改选。
      x-example-request: GET /v1/entitlements
  /v1/purchases/token:
    post:
      operationId: getPurchaseToken
      tags:
      - purchases
      summary: 为当前用户取得稳定的苹果购买归属标识
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetPurchaseTokenResult'}
              example:
                app_account_token: ed394359-d26a-428e-b350-584305a9db4b
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      x-example-request: POST /v1/purchases/token
  /v1/purchases:
    post:
      operationId: createOrder
      tags:
      - purchases
      summary: 安卓微信或支付宝下单
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrderInput'}
            example:
              request_id: 85b72033-9f07-4bbc-8567-fc31f26508ab
              platform: wechat
              product: monthly
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateOrderResult'}
              example:
                order_id: 85b72033-9f07-4bbc-8567-fc31f26508ab
                payment_payload: example-only
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      x-example-request: POST /v1/purchases
  /v1/purchases/restore:
    post:
      operationId: restorePurchase
      tags:
      - purchases
      summary: 校验交易归属，非原主返回冲突，不覆盖账号
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RestorePurchaseInput'}
            example:
              signed_transaction: example-only
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Entitlements'}
              example:
                tier: free
                expires_at: null
                allowances:
                - feature: practice
                  remaining: null
                  resets_at: '2026-11-21T09:00:00+08:00'
                max_active_contacts: null
                auto_watch_alert_available: false
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
        '409': {$ref: '#/components/responses/E409'}
      description: 首次购买和恢复均可提交 Apple 签名交易；验证交易及 appAccountToken 归属，重复提交幂等，绝不按当前登录者改绑。
      x-example-request: POST /v1/purchases/restore
  /v1/payment-notifications/apple:
    post:
      operationId: receiveAppleNotification
      tags:
      - payment-notifications
      summary: 平台回调：验签并按交易/通知 ID 幂等
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReceiveAppleNotificationInput'}
            example:
              signedPayload: example-only
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ack'}
              example:
                ok: true
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      x-example-request: POST /v1/payment-notifications/apple
  /v1/payment-notifications/wechat:
    post:
      operationId: receiveWechatNotification
      tags:
      - payment-notifications
      summary: 平台回调：验签并按交易/通知 ID 幂等
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReceiveWechatNotificationInput'}
            example:
              id: 85b72033-9f07-4bbc-8567-fc31f26508ab
              event_type: TRANSACTION.SUCCESS
              resource:
                algorithm: AEAD_AES_256_GCM
                ciphertext: example-only
                nonce: example-only
                associated_data: example-only
      responses:
        '200':
          description: 已接收，空响应
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      parameters:
      - name: Wechatpay-Timestamp
        in: header
        required: true
        schema: {type: string}
        example: example-only
      - name: Wechatpay-Nonce
        in: header
        required: true
        schema: {type: string}
        example: example-only
      - name: Wechatpay-Signature
        in: header
        required: true
        schema: {type: string}
        example: example-only
      - name: Wechatpay-Serial
        in: header
        required: true
        schema: {type: string}
        example: example-only
      description: 对原始请求字节验签后解密资源，核对商户、应用、金额及订单；平台附加字段不能在验签前丢弃。
      x-example-request: POST /v1/payment-notifications/wechat
  /v1/payment-notifications/alipay:
    post:
      operationId: receiveAlipayNotification
      tags:
      - payment-notifications
      summary: 平台回调：验签并按交易/通知 ID 幂等
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/ReceiveAlipayNotificationInput'}
            example:
              notify_id: example-only
              trade_no: example-only
              out_trade_no: example-only
              trade_status: TRADE_SUCCESS
              sign: example-only
              sign_type: RSA2
      responses:
        '200':
          description: 验签成功
          content:
            text/plain:
              schema: {type: string}
              example: success
        '400': {$ref: '#/components/responses/E400'}
        '500': {$ref: '#/components/responses/E500'}
        '401': {$ref: '#/components/responses/E401'}
      description: 对完整表单按渠道规则验签，核对应用、收款方、金额及订单；仅处理成功返回纯文本 success。
      x-example-request: POST /v1/payment-notifications/alipay
  /v1/assessments/instrument:
    get:
      operationId: getInstrument
      tags:
      - assessments
      summary: 当前授权题库，返回 16 题及 1–7 选项
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetInstrumentResult'}
              example:
                version: wleis-2026-11
                items:
                - id: 1
                  dimension: SEA
                  zh: 大多数时候，我都清楚自己为什么会有某种感受。
                - id: 2
                  dimension: SEA
                  zh: 我很了解自己的情绪。
                - id: 3
                  dimension: SEA
                  zh: 我真正明白自己的感受。
                - id: 4
                  dimension: SEA
                  zh: 我总是知道自己是否开心。
                - id: 5
                  dimension: OEA
                  zh: 我总能从朋友的行为中了解他们的情绪。
                - id: 6
                  dimension: OEA
                  zh: 我很善于观察别人的情绪。
                - id: 7
                  dimension: OEA
                  zh: 我对他人的感受和情绪很敏感。
                - id: 8
                  dimension: OEA
